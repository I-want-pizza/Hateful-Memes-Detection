experiment:
  name: clip_unfreeze_1
  output_dir: outputs/clip_unfreeze_1/

dataset:
  data_dir: data
  max_length: 77

model:
  type: clip
  clip_model: openai/clip-vit-base-patch32
  num_classes: 2
  dropout: 0.2
  encoder_strategy: unfreeze_1   # last 1 transformer block per encoder
  fusion: concat

training:
  epochs: 42
  batch_size: 16
  lr: 1.0e-4          # head LR
  lr_backbone: 2.0e-6  # unfrozen encoder layers LR
  weight_decay: 1.0e-4
  fp16: false
  grad_accumulation_steps: 1
  early_stopping_patience: 5
  label_smoothing: 0.0
  num_workers: 4
  device: cuda

logging:
  wandb_project: hateful-memes-clf
  log_every: 1
