experiment:
  name: clip_unfreeze_6
  output_dir: outputs/clip_unfreeze_6/

dataset:
  data_dir: data
  max_length: 77

model:
  type: clip
  clip_model: openai/clip-vit-base-patch32
  num_classes: 2
  dropout: 0.2
  encoder_strategy: unfreeze_6
  fusion: concat

training:
  epochs: 30
  batch_size: 8      # smaller batch due to more parameters
  lr: 1.0e-4
  lr_backbone: 2.0e-6
  weight_decay: 1.0e-4
  fp16: true          # enable FP16 to fit in VRAM
  grad_accumulation_steps: 2
  early_stopping_patience: 5
  label_smoothing: 0.0
  num_workers: 4
  device: cuda

logging:
  wandb_project: hateful-memes-clf
  log_every: 1
