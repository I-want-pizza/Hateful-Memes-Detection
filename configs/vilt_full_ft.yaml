experiment:
  name: vilt_full_ft
  output_dir: outputs/vilt_full_ft/

dataset:
  data_dir: data
  max_length: 40
  image_size: 384

model:
  type: vilt
  model_name: dandelin/vilt-b32-mlm
  num_classes: 2
  hidden_dim: 768
  dropout: 0.1
  encoder_strategy: full_ft
  gradient_checkpointing: false

training:
  epochs: 15
  batch_size: 16
  lr: 2.0e-5
  weight_decay: 0.05
  fp16: true
  grad_accumulation_steps: 2   # effective batch = 32
  early_stopping_patience: 3
  label_smoothing: 0.0
  num_workers: 4
  device: cuda

logging:
  wandb_project: hateful-memes-clf
  log_every: 1
