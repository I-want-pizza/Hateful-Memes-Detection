experiment:
  name: vilt_lora_r4
  output_dir: outputs/vilt_lora_r4/

dataset:
  data_dir: data
  max_length: 40
  image_size: 384

model:
  type: vilt
  model_name: dandelin/vilt-b32-mlm
  num_classes: 2
  hidden_dim: 768
  dropout: 0.1
  encoder_strategy: lora
  lora_r: 4
  lora_alpha: 8
  lora_dropout: 0.1
  gradient_checkpointing: false

training:
  epochs: 30
  batch_size: 32
  lr: 2.0e-4
  weight_decay: 0.05
  fp16: true
  grad_accumulation_steps: 1
  early_stopping_patience: 5
  label_smoothing: 0.0
  num_workers: 4
  device: cuda

logging:
  wandb_project: hateful-memes-clf
  log_every: 1
