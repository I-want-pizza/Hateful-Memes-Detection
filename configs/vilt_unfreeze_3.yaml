experiment:
  name: vilt_unfreeze_3
  output_dir: outputs/vilt_unfreeze_3/

dataset:
  data_dir: data
  max_length: 40
  image_size: 384

model:
  type: vilt
  model_name: dandelin/vilt-b32-mlm
  num_classes: 2
  hidden_dim: 768
  dropout: 0.1
  encoder_strategy: unfreeze_3   # last 3 of 12 transformer layers
  gradient_checkpointing: false

training:
  epochs: 28
  batch_size: 16
  lr: 2.0e-5          # head LR
  lr_backbone: 2.0e-6  # unfrozen backbone LR
  weight_decay: 0.05
  fp16: true
  grad_accumulation_steps: 2
  early_stopping_patience: 4
  label_smoothing: 0.0
  num_workers: 4
  device: cuda

logging:
  wandb_project: hateful-memes-clf
  log_every: 1
