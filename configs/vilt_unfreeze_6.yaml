experiment:
  name: vilt_unfreeze_6
  output_dir: outputs/vilt_unfreeze_6/

dataset:
  data_dir: data
  max_length: 40
  image_size: 384

model:
  type: vilt
  model_name: dandelin/vilt-b32-mlm
  num_classes: 2
  hidden_dim: 768
  dropout: 0.1
  encoder_strategy: unfreeze_6   # last 6 of 12 transformer layers
  gradient_checkpointing: true   # needed for memory with 57M params

training:
  epochs: 20
  batch_size: 8
  lr: 2.0e-5
  lr_backbone: 2.0e-6
  weight_decay: 0.05
  fp16: true
  grad_accumulation_steps: 4    # effective batch = 32
  early_stopping_patience: 4
  label_smoothing: 0.0
  num_workers: 4
  device: cuda

logging:
  wandb_project: hateful-memes-clf
  log_every: 1
